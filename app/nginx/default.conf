server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    # Health check — used by Docker healthcheck in compose.yaml
    location /health {
        proxy_pass http://fastapi:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # All API routes
    location /api/ {
        proxy_pass http://fastapi:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Important for large file uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /storage/ {
        # Nama container minio di docker-compose Anda
        proxy_pass http://cloudscope-minio:9000/; 
        
        # INI KUNCI UTAMANYA: Paksa Nginx berbohong kepada MinIO 
        # bahwa permintaan ini datang dari localhost:9000
        proxy_set_header Host localhost:9000; 
        
        # Agar file berukuran besar bisa lewat tanpa dipotong Nginx
        proxy_buffering off;
    }
    
    # Frontend 
    location / {
        # Jalur di dalam container Nginx
        root /usr/share/nginx/html;
        index index.html;
        
        try_files $uri $uri/ /index.html;
    }
}
