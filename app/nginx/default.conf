server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/cloudscope.crt;
    ssl_certificate_key /etc/nginx/certs/cloudscope.key;

    client_max_body_size 500M;

    # Health check — used by Docker healthcheck in compose.yaml
    location /health {
        proxy_pass http://fastapi:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # All API routes
    location /api/ {
        proxy_pass http://fastapi:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Important for large file uploads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Frontend — React SPA served by frontend container
    location / {
        proxy_pass http://cloudscope-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
