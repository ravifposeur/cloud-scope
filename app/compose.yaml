name: cloudscope

services:
  postgres:
    image: postgres:16-alpine
    container_name: cloudscope-postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "cloudscope"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudscope-net

  redis:
    image: redis:7-alpine
    container_name: cloudscope-redis
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudscope-net

  minio:
    image: minio/minio
    container_name: cloudscope-minio
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"
      - "9000:9000"
    env_file:
      - .env
    volumes:
      # FIX 2: Use the named volume consistently (removed orphaned bind mount)
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudscope-net

  fastapi:
    build: ./backend
    container_name: cloudscope-fastapi
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000  
    env_file:
      - .env
    volumes:
      - /tmp/cloudscope:/tmp/cloudscope
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - cloudscope-net

  worker:
    build:
      context: .
      dockerfile: ./worker/Dockerfile
    container_name: cloudscope-worker
    command: celery -A app.worker.celery_config worker --loglevel=info
    env_file:
      - .env
    volumes:
      - /tmp/cloudscope:/tmp/cloudscope
    depends_on:
      redis:
        # FIX 1: Added redis with service_healthy so worker waits for broker
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 7g
          cpus: "8"
    networks:
      - cloudscope-net

  nginx:
    image: nginx:1.25-alpine
    container_name: cloudscope-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/certs:/etc/nginx/certs
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      fastapi:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cloudscope-net

  seed:
    build: ./backend
    container_name: cloudscope-seed
    command: python scripts/seed.py
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles:
      - seed
    networks:
      - cloudscope-net

  flower:
    build: ./backend
    container_name: cloudscope-flower
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    command: celery -A app.worker.celery_config.celery flower --port=5555
    networks:
      - cloudscope-net

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudscope-tunnel
    # Ganti string token di bawah dengan token asli Anda yang belum disensor
    command: tunnel --no-autoupdate run --token eyJhIjoiOTllMWIxMjFlY2RhZjc5ZmUzYjk2ZTkzYjRkZDQ5YzkiLCJ0IjoiMmY1MDNmMDktMWM4NS00OGIwLThkMWEtMTBiZjJiZjU0M2M0IiwicyI6Ik9HRTJNVFJqTlRNdE4yUmxNQzAwWXpGa0xUazBaVEl0WVdFNFpUUXdPRFJsTW1GaSJ9
    restart: unless-stopped
    networks:
      - cloudscope-net

  quick-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudscope-quick-tunnel
    # 👇 Tembak langsung ke Nginx, tanpa token, tanpa dasbor!
    command: tunnel --url http://nginx:80
    restart: unless-stopped
    networks:
      - cloudscope-net
      
volumes:
  postgres_data:
  minio_data:

networks:
  cloudscope-net:
    driver: bridge
